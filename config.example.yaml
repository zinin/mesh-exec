# ============================================================================
# mesh — example configuration (mesh-exec and mesh-review read this one file)
# ============================================================================
# Copy this file to  ~/.config/mesh/config.yaml  and edit; chmod 600 — it will hold tokens.
# ($XDG_CONFIG_HOME/mesh/config.yaml when XDG_CONFIG_HOME is set; MESH_CONFIG overrides the path.)
#
# WARNING: the live config.yaml contains plaintext API tokens once edited.
#          DO NOT commit it to any git repo. Only this *.example.yaml (with
#          REPLACE_ME placeholders) belongs in version control.
#
# How it loads:
#   * Parsed by shared/config-loader.sh on the first call of any skill/agent in
#     a session, then re-read between bash invocations (edit → effect is immediate).
#   * The loader VALIDATES the whole file on load. ANY error → the command refuses
#     to start and prints, on stderr, the exact yaml location + how to fix it.
#     ONE deliberate exception, on the preset-read path only: if a preset names `grok`
#     while the `grok:` section does not validate — a broken catalog, or a section that is
#     not a mapping at all, such as `grok: false` — the read DEGRADES grok alone —
#     that reviewer is not offered, the orchestrator says so out loud, and every other
#     engine runs. `config-loader.sh validate` still rejects the file.
#   * Sections are independent: omit an optional section to disable that feature.
#
# Legend used below:  [required] / [optional]  and  "valid: a | b | c" enumerations.
# ============================================================================


# ============================================================================
# (1) providers — HTTP endpoints of Anthropic-compatible APIs   [required, >=1]
# ============================================================================
# Each model (section 2) points at exactly one provider via its id prefix.
providers:
  - id: zai                                    # [required] slug, must match [a-z0-9-]+ and be unique.
                                               #   Ends up in run-dir paths (runs/ext-claude/<provider>/...),
                                               #   so it must be filesystem-safe. Dots/underscores are
                                               #   reserved for the model <short> id (section 2), not here.
    label: "Z.AI"                              # [required] shown in the UI and logs. Must NOT contain '|'
                                               #   (the '|' breaks the pipe-delimited list output).
    base_url: https://api.z.ai/api/anthropic   # [required] must start with http:// or https://
    token: "REPLACE_ME"                        # [required] plaintext token. The literal "REPLACE_ME"
                                               #   passes `validate` but fails at export time with a clear
                                               #   "edit your token" error — so this example validates as-is.
    kind: anthropic-api                        # [optional] default: anthropic-api
                                               #   valid: anthropic-api | ollama-daemon
                                               #     anthropic-api  — standard Anthropic-compatible endpoint.
                                               #     ollama-daemon  — adds an /api/tags reachability probe +
                                               #                      cold-start retry before `claude -p`.

  - id: alibaba
    label: "Alibaba Cloud"
    base_url: https://coding-intl.dashscope.aliyuncs.com/apps/anthropic
    token: "REPLACE_ME"

  - id: deepseek
    label: "DeepSeek"
    base_url: https://api.deepseek.com/anthropic
    token: "REPLACE_ME"

  - id: litellm
    label: "LiteLLM (local proxy on 127.0.0.1:4000)"
    # Assumes the proxy exposes the Anthropic-compatible /v1/messages endpoint.
    # If your LiteLLM runs in OpenAI-compat mode only, pass SKIP_TOKEN_PRECHECK=1
    # when calling ext-claude-exec — `claude -p` will then surface HTTP errors
    # instead of the loader's 401-precheck.
    base_url: http://127.0.0.1:4000
    token: "dummy"                             # local proxy ignores the token, but the field is required.

  - id: ollama
    label: "Ollama (local daemon on 127.0.0.1:11434)"
    base_url: http://127.0.0.1:11434
    token: "ollama"
    kind: ollama-daemon
    # NOTE: kind=ollama-daemon assumes the daemon exposes an Anthropic-compatible
    # endpoint at /v1/messages — `claude -p` POSTs there. Plain Ollama only serves
    # /api/generate and /api/chat. Working configurations: (a) signed-in Ollama
    # Cloud daemon (built-in Anthropic-compat proxy), (b) a local LiteLLM in front
    # of Ollama that translates Anthropic↔Ollama, (c) Ollama 0.4+ with
    # `ollama serve --openai-compat-anthropic` (if/when shipped).
    # See README troubleshooting "Ollama daemon unreachable / 404 from /v1/messages".


# ============================================================================
# (2) models — id = "<provider>/<short>"                        [required, >=1]
# ============================================================================
# <provider> must be one of the providers above. <short> must match [a-z0-9._-]+.
# The id must be unique and contain exactly one "/". On selection, the loader
# exports the env block that points `claude -p` at this model.
models:
  - id: zai/glm                                # [required] "<provider>/<short>"; provider inferred from prefix.
    label: "GLM 5.1"                           # [required] UI/logs; no '|'.
    model: glm-5.1                             # [required] → ANTHROPIC_MODEL, and (unless overridden below)
                                               #   ANTHROPIC_DEFAULT_{OPUS,SONNET,HAIKU}_MODEL + CLAUDE_CODE_SUBAGENT_MODEL.
    # ---- per-model overrides (all [optional]; each defaults to `model:` above) ----
    # opus_model:     glm-5.1                   # → ANTHROPIC_DEFAULT_OPUS_MODEL
    # sonnet_model:   glm-5.1                   # → ANTHROPIC_DEFAULT_SONNET_MODEL
    # haiku_model:    glm-5.1                   # → ANTHROPIC_DEFAULT_HAIKU_MODEL  (the "small/fast" model)
    # subagent_model: glm-5.1                   # → CLAUDE_CODE_SUBAGENT_MODEL
    # context_window: 200000                    # [optional] integer → CLAUDE_CODE_AUTO_COMPACT_WINDOW.
                                               #   Omit to leave Claude Code's auto-compaction at its default.

  - id: alibaba/glm
    label: "Alibaba GLM 5"
    model: glm-5

  - id: alibaba/qwen
    label: "Alibaba Qwen Coder"
    model: qwen3-coder-plus

  - id: alibaba/kimi
    label: "Alibaba Kimi"
    model: kimi-k2.5

  - id: alibaba/minimax
    label: "Alibaba MiniMax"
    model: minimax-m2.7

  - id: deepseek/v4-pro
    label: "DeepSeek V4 Pro (1M)"
    model: "deepseek-v4-pro[1m]"               # quote any value containing []/special chars.
    haiku_model: "deepseek-v4-flash[1m]"       # example override: cheaper "small/fast" model.
    context_window: 1000000

  - id: litellm/kimi
    label: "Kimi via LiteLLM"
    model: kimi-k2.5

  - id: ollama/kimi
    label: "Kimi K2.6 (Ollama)"
    model: kimi-k2.6:cloud
    haiku_model: deepseek-v4-flash:cloud

  - id: ollama/deepseek
    label: "DeepSeek V4 Pro 1M (Ollama)"
    model: deepseek-v4-pro:cloud
    haiku_model: deepseek-v4-flash:cloud
    context_window: 1000000

  - id: ollama/minimax
    label: "MiniMax M2.7 (Ollama)"
    model: minimax-m2.7:cloud
    haiku_model: minimax-m2.7:cloud


# ============================================================================
# (3) Built-in reviewers                                          [optional]
# ============================================================================
# Configuration for the four YAML-gated reviewer types selectable in
# `defaults.*.builtin`: claude, codex, gemini, grok. A fifth type, `native`, has
# no section here — it is not a gate; see defaults below.
#
#   * codex: / gemini: / grok: are GATES — they shell out to the codex / gemini /
#     grok CLIs and are NOT Anthropic-API endpoints. Omit a section entirely to
#     remove that tool from the UI and from any `defaults.*.builtin` list
#     (referencing it in builtin then becomes a hard error).
#   * claude: is NOT a gate — on Claude Code the built-in claude reviewer is your
#     own session and has no external dependency, so `builtin: [claude]` works with
#     no section here at all. The section only WIDENS it to several Claude models.
#     On Grok, `claude` is the Claude Code CLI (`claude -p`), not the host model.
#   * native has no YAML section. `builtin: [native]` is valid with nothing here.
claude:
  # Catalog of Claude models offered when you pick the built-in `claude` reviewer.
  # Each entry becomes ONE independent reviewer: same diff, same prompt, different
  # model — so `[opus, fable]` gives you two genuinely independent cross-checks that
  # your main session then aggregates.
  #
  # Values are what the Task tool's `model:` parameter accepts in YOUR Claude Code
  # build — practically the aliases `opus | sonnet | haiku | fable`. No enum is
  # enforced (a new model must never require a plugin release), so a name your build
  # does not support is not caught here: the dispatch fails at runtime instead.
  #
  # COST: N models = N full reviews. Three Claude models plus codex plus five
  # external models is nine reviewers for one /mesh-review:mesh-review.
  #
  # Omit this section (or leave the list empty) and the built-in claude reviewer
  # behaves exactly as before: exactly ONE reviewer, on runtime.dispatch_model, or
  # on your current session model when that is unset.
  #
  # BUT: `defaults.*.claude_models` entries must be members of this catalog, so
  # dropping the catalog ALONE makes the config INVALID — every preset entry below
  # then reports as an unknown claude model. Remove (or empty) BOTH `claude_models`
  # keys under `defaults:` together with this section.
  models: [opus, sonnet, fable]                # [optional] list of Claude model aliases

codex:
  model: gpt-5.5                               # [required when codex: present]
  # [optional] known levels as of 2026-07: none | minimal | low | medium | high | xhigh | ultra.
  # Unknown values pass through with a WARN (the codex CLI validates). This list is the
  # canonical copy — keep the agent defs and README in sync with it.
  reasoning_level: xhigh

gemini:
  model: gemini-3.1-pro-preview                # [required when gemini: present]

grok:
  # Catalog of grok models offered when you pick the built-in `grok` reviewer. REQUIRED when
  # this section exists, and it must hold at least one entry: the grok reviewer agent refuses
  # to start without a model, so an empty catalog would offer a reviewer that cannot run.
  # (claude:'s catalog is optional; this one is not — and note the narrower CHARSET below.)
  #
  # Each entry becomes ONE independent reviewer, exactly as under claude: — same diff, same
  # prompt, different model.
  #
  # What belongs here: the names THIS MACHINE's grok CLI accepts after `-m`, which is not the
  # same set as "the grok family" — run `grok models` to see them. The catalog is yours: it may
  # well list models proxied in from other vendors (deepseek-*, glm-*, minimax-*, kimi-*,
  # codex-*), and your own CLI default may be one of those. mesh-exec does not police the
  # names and cannot: a model your CLI does not accept is not caught here, it fails that
  # reviewer's run instead.
  #
  # Still, prefer keeping this catalog to the grok family. mesh-exec cannot tell that a grok
  # alias and one of your ext-claude models (section 2) are the same model underneath —
  # `grok models` prints names, never the provider behind them — so listing both makes ONE
  # opinion count twice in the attribution table.
  #
  # CHARSET: [A-Za-z0-9._-] (first char alphanumeric), narrower than claude.models. A grok
  # model id becomes a directory name (runs/grok/<model>/) and a roster entry for the run
  # watcher, and neither accepts ':'.
  models: [grok-4.6, grok-4.5]                 # [required when grok: present, >=1 entry]

  # [optional] values this loader passes without a WARN, as of 2026-08 (grok 1.0.5):
  # low | medium | high | xhigh | max. NOT an enum — the set goes stale as xAI ships levels,
  # so unknown values pass through with a WARN and the grok CLI decides. This list is the
  # canonical copy — keep config-loader.sh's known-value case and the README row in sync
  # with it, and re-read `grok --help` whenever you touch any of the three.
  #
  # The SECTION-WIDE default — but the CLI validates the flag PER MODEL, and rejects at
  # ARGUMENT PARSING with rc=1, before any API call, so an unsupported pair costs you the
  # whole reviewer run and no diagnostic from here. Measured 2026-08-30 on grok 1.0.5:
  # grok-4.6 accepts xhigh|high|medium|low, grok-4.5 only high|medium|low, and that CLI's
  # own default model all five — three different sets behind one binary. So this value must
  # be valid for every catalog entry that `model_efforts` below does not override. To read a
  # model's own set for free (it fails on the flag, never reaching the API):
  # `grok -m <id> --effort __bogus__ -p x`.
  #
  # Omit the key and the CLI's own default applies (~/.grok/config.toml, [models]
  # default_reasoning_effort) — which is per-CLI, not per-model, and may well be `low`.
  reasoning_effort: xhigh

  # [optional] PER-MODEL overrides of the level above — the key that lets one catalog hold
  # models with different accepted sets. That is why grok-4.5 can sit beside grok-4.6 here:
  # the section default `xhigh` is not a level grok-4.5 accepts, and without the override
  # below every grok-4.5 run would die at argument parsing.
  #
  # Keys must be entries of `models:` above — a key outside the catalog is a HARD ERROR, not
  # a no-op, because a silent no-op would leave you believing a model ran at a level it never
  # got. Values follow `reasoning_effort`'s rules exactly: unknown ones pass through with a
  # WARN, an empty one means "use the section default".
  #
  # Write only the EXCEPTIONS. Most models accept the top level, so one or two entries beside
  # a section default usually cover a whole catalog. To regenerate the table when your catalog
  # or your CLI changes — it never reaches the API, every probe fails on the flag:
  #
  #   for m in $(grok models | sed -n 's/^ *[-*] \([A-Za-z0-9._-]*\).*/\1/p'); do
  #       printf '%-28s %s\n' "$m" "$(grok -m "$m" --effort __bogus__ -p x 2>&1 |
  #           sed -n 's/.*use one of: //p' | head -1)"
  #   done
  #
  # Rank each printed set by low < medium < high < xhigh < max and take the top one: the CLI
  # prints them in different ORDERS per model, so position is not rank. A model that prints no
  # set at all does not validate the flag — leave it out and it will ignore whatever it gets.
  model_efforts:
    grok-4.5: high


# ============================================================================
# (4) defaults — preset reviewer sets for the "default" command argument
# ============================================================================
# Consumed by the mesh-review plugin: `/mesh-review:mesh-review default` / `/mesh-review:mesh-design-review default`.
# The whole `defaults:` section is [optional]; each preset and each field inside
# is [optional] too.
defaults:
  code_review:                                 # used by: /mesh-review:mesh-review default
    builtin: [native, claude, codex, gemini, grok]
                                               # [optional] list; subset of { native, claude, codex, gemini, grok }.
                                               #   native  — host models. On Claude Code this collapses into
                                               #             claude (not a second set). On Grok: spawn_subagent
                                               #             with slugs from live `grok models` / native_models.
                                               #             Needs NO config section.
                                               #   claude  — on Claude Code: your own session via
                                               #             superpowers:requesting-code-review (needs NO
                                               #             config section; see claude: above to fan it
                                               #             out over several models). On Grok: the Claude
                                               #             Code CLI (`claude -p`, runs/claude/<alias>/).
                                               #   codex   — requires the codex: section above.
                                               #   gemini  — requires the gemini: section above.
                                               #   grok    — requires the grok: section above AND a non-empty
                                               #             grok_models below; see that key for why.
    native_models: [grok-4.6, glm-5-3, kimi-k3]
                                               # [optional] ignored on Claude Code; Grok default native set.
                                               #   slugs must exist in live `grok models` or that reviewer
                                               #   is skipped (not a loader error). "native" must be in
                                               #   builtin — native_models without it is invalid. Empty or
                                               #   absent with native in builtin is valid (one reviewer on
                                               #   the Grok session model).
    claude_models: [opus, fable]               # [optional] list; each entry must be in the claude.models
                                               #   catalog above, and "claude" must be present in builtin.
                                               #   In `default` mode: one reviewer per entry, each overriding
                                               #   runtime.dispatch_model.
                                               #   In the interactive UI: these get the ★ recommended marker,
                                               #   while the rest of the catalog is merely offered.
                                               #   Omit it and `default` mode runs exactly ONE claude reviewer,
                                               #   on runtime.dispatch_model — or on your current session model
                                               #   when that is unset — i.e. the behaviour from before this feature.
    grok_models: [grok-4.6]                    # [optional] list; each entry must be in the grok.models
                                               #   catalog above. Same reviewer-per-entry and ★-recommended
                                               #   semantics as claude_models — but the pairing with builtin
                                               #   is REQUIRED IN BOTH DIRECTIONS, and each direction is a
                                               #   hard error, never a silent skip:
                                               #     grok_models without "grok" in builtin  -> config invalid
                                               #     "grok" in builtin without grok_models  -> config invalid
                                               #   There is no single-reviewer fallback the way claude has one:
                                               #   the grok reviewer agent cannot start without a model, so
                                               #   there is nothing to fall back TO.
                                               #   COST, as under claude:. On Grok this preset as shipped is
                                               #   TWELVE reviewers of one diff: 3 native + 2 claude + codex
                                               #   + gemini + 1 grok + 4 external. On Claude Code native is
                                               #   ignored, so NINE. Trim the lists before using it as-is.
    models: [zai/glm, ollama/kimi, deepseek/v4-pro, ollama/minimax]
                                               # [optional] list; each entry must be a model id from section 2.
    run_mode: background                       # [optional] valid: background | team
                                               #   background — each reviewer runs as a detached background
                                               #                Task (non-blocking; collect results when ready).
                                               #   team       — reviewers run as a coordinated agent team
                                               #                (TeamCreate + teammates).
                                               #   NOTE: team mode is still experimental and currently
                                               #         works poorly — prefer 'background' (the default).

  design_review:                               # used by: /mesh-review:mesh-design-review default
    builtin: [native, claude, codex, gemini, grok]
                                               # [optional] same valid set { native, claude, codex, gemini, grok }.
    native_models: [grok-4.6, glm-5-3, kimi-k3]
                                               # [optional] ignored on Claude Code; Grok default native set.
                                               #   slugs must exist in live `grok models` or that reviewer
                                               #   is skipped. Same pairing as code_review.
    claude_models: [opus]                      # [optional] deliberately narrower than code_review's —
                                               #   the two presets are independent.
    grok_models: [grok-4.6]                    # [optional] narrower than code_review's for the same reason.
                                               #   Still required, because "grok" is in builtin above.
    models: [zai/glm, ollama/kimi, deepseek/v4-pro, ollama/minimax]
                                               # NOTE: design_review has NO run_mode field (ignored if present).


# ============================================================================
# (5) runtime — UI preferences and supervised-run timeouts        [optional]
# ============================================================================
runtime:
  default_run_mode: background                 # [optional] valid: background | team
                                               #   Pre-selects the run-mode choice in the /mesh-review:mesh-review UI.
                                               #   Keep 'background': team mode is experimental and
                                               #   currently unreliable; background is the safe default.

  # do-plan's STOP threshold moved to the session-relay plugin: stop_tokens in
  # ~/.config/session-relay/config.yaml. A do_plan_default_stop_tokens key left here is ignored.

  # /mesh-review:mesh-review Step 6.0 delegation guard: if a wrapper reviewer (codex/gemini/grok/ext-claude)
  # flips to self-review (no run dir) or stalls mid-flight, re-dispatch it up to this many
  # rounds. Three verdicts are never retried, because a second identical run cannot differ:
  # BROKEN (the engine finished having done no work — swap the model instead), DEGRADED (the
  # CLI refused the reviewer's tool calls; its partial findings are kept) and KILLED (something
  # outside the run signalled it — the same launch is killed the same way).
  max_redispatch: 1                            # [optional] positive integer. default 1

  # Model for subagents dispatched by mesh-exec's wrapper agents and by mesh-review
  # (/mesh-review:mesh-review, /mesh-review:mesh-design-review). do-plan has its own, in session-relay.
  # [optional] If set, those commands pass `model: "<value>"` on nearly every dispatch —
  # the exception is built-in claude reviewers running on an explicitly selected Claude
  # model (see `claude:` above), which carry that model instead and ignore this value.
  # If absent (or config.yaml absent), subagents inherit your current session model
  # (your /model). Set this to FORCE a specific tier regardless of the session.
  # Accepts any Claude Code Agent model alias or id — incl. full cloud-provider ids
  # (e.g. opus, sonnet, fable, claude-fable-5, Bedrock us.anthropic.…-v2:0, Vertex
  # claude-opus-4@date). No enum is enforced — flip it freely when a model opens or
  # closes, no plugin release needed. Charset: [A-Za-z0-9._:@-] (first char alphanumeric).
  # dispatch_model: opus

  timeouts:                                    # all [optional]; each must be a positive integer (seconds).
    single_run_sec: 1800                       # one `claude -p` attempt (wrapped in `timeout`). default 1800
    stall_sec: 600                             # no output for this long → supervised mode kills and retries;
                                               #   the mesh-review watcher
                                               #   (shared/watch-runs.sh) reports the run SILENT. default 600.
                                               #   The watcher floors this at 600: codex-exec, gemini-exec and
                                               #   grok-exec hardcode HARD_ZERO_TIMEOUT=600 and ignore this key,
                                               #   so a lower value would call a live run silent before its own
                                               #   watchdog acts on it.
    global_sec: 3600                           # supervised mode: overall wall-clock budget. default 3600
    max_retries: 2                             # supervised mode: retries after a kill. default 2
